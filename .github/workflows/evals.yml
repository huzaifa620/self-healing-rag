name: evals

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guardrails:
    # Pure unit tests — no API keys, so these run on forks too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest evals/test_guardrails.py -q

  evals:
    name: eval gate
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only, so posting the results table needs
    # pull_requests: write explicitly.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The corpus index is committed, so there is nothing to build and no vector
      # database to reach. Verify it matches its manifest before trusting any number.
      - name: Verify corpus integrity
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("corpus")
          manifest = json.loads((root / "MANIFEST.json").read_text())
          digest = hashlib.sha256((root / "chunks.jsonl").read_bytes()).hexdigest()
          assert digest == manifest["chunks_sha256"], "chunks.jsonl does not match MANIFEST.json"
          print(f"corpus ok: {manifest['n_chunks']} chunks @ {manifest['tag']}")
          PY

      - name: Run evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_evals

      - name: Enforce gates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pytest evals/test_gates.py -q

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/results/latest.json';
            if (!fs.existsSync(path)) return;
            const d = JSON.parse(fs.readFileSync(path, 'utf8'));
            const base = fs.existsSync('evals/baseline.json')
              ? JSON.parse(fs.readFileSync('evals/baseline.json', 'utf8')).summary : {};
            const rows = Object.entries(d.summary)
              .map(([k, v]) => `| ${k} | ${v} | ${base[k] ?? '—'} |`).join('\n');
            const status = '${{ job.status }}' === 'success' ? '✅ gates passed' : '❌ gates failed';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${status}\n\n`
                  + `judge: \`${d.judge_model}\` (cross-provider: ${d.judge_cross_provider}) · `
                  + `wall ${d.wall_seconds}s\n\n`
                  + `| metric | this run | baseline |\n|---|---|---|\n${rows}`
            });

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
